name: Build Arch Linux ARM image for UTM SE

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner (ARM is faster; it needs a PUBLIC repo)"
        type: choice
        default: ubuntu-24.04-arm
        options:
          - ubuntu-24.04-arm
          - ubuntu-latest
      size:
        description: "Virtual disk size"
        type: string
        default: "10G"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    env:
      IMG_SIZE: ${{ inputs.size }}
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools parted dosfstools e2fsprogs qemu-utils
          if [ "$(uname -m)" = "x86_64" ]; then
            sudo apt-get install -y qemu-user-static binfmt-support
          fi

      - name: Build disk image
        shell: sudo -E bash -euxo pipefail {0}
        run: |
          WORK="$RUNNER_TEMP/arch"
          ROOT=/mnt/arch
          IMG="$WORK/disk.img"
          mkdir -p "$WORK" "$ROOT"

          # ---- 1. empty disk: GPT, 512MB EFI (FAT32) + ext4 root ----
          truncate -s "$IMG_SIZE" "$IMG"
          LOOP=$(losetup --find --show --partscan "$IMG")
          echo "LOOP=$LOOP" >> "$GITHUB_ENV"
          parted -s "$LOOP" mklabel gpt \
            mkpart ESP fat32 1MiB 513MiB set 1 esp on \
            mkpart root ext4 513MiB 100%
          partprobe "$LOOP" || true
          udevadm settle || true
          for i in $(seq 15); do [ -b "${LOOP}p2" ] && break; sleep 1; done
          mkfs.vfat -F32 -n BOOT "${LOOP}p1"
          mkfs.ext4 -q -L archroot "${LOOP}p2"

          # ---- 2. download and extract the generic ARM64 rootfs ----
          mount "${LOOP}p2" "$ROOT"
          URL=os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz
          curl -fL --retry 5 -o "$WORK/rootfs.tar.gz" "https://$URL" \
            || curl -fL --retry 5 -o "$WORK/rootfs.tar.gz" "http://$URL"
          bsdtar -xpf "$WORK/rootfs.tar.gz" -C "$ROOT"
          rm -f "$WORK/rootfs.tar.gz"

          # ---- 3. /boot lives on the FAT partition from the start ----
          mkdir -p "$WORK/bootp"
          mount "${LOOP}p1" "$WORK/bootp"
          cp -rL --no-preserve=all "$ROOT/boot/." "$WORK/bootp/"
          umount "$WORK/bootp"
          rm -rf "${ROOT:?}"/boot/*
          mount "${LOOP}p1" "$ROOT/boot"

          # ---- 4. prepare chroot ----
          mount -t proc proc "$ROOT/proc"
          mount -t sysfs sys "$ROOT/sys"
          mount --bind /dev "$ROOT/dev"
          mount --bind /dev/pts "$ROOT/dev/pts"
          mount -t tmpfs tmpfs "$ROOT/run"
          mount -t tmpfs tmpfs "$ROOT/tmp"
          rm -f "$ROOT/etc/resolv.conf"
          echo "nameserver 1.1.1.1" > "$ROOT/etc/resolv.conf"
          if [ "$(uname -m)" = "x86_64" ]; then
            cp /usr/bin/qemu-aarch64-static "$ROOT/usr/bin/"
          fi

          # ---- 5. update the system INSIDE the chroot (fast host) ----
          chroot "$ROOT" /bin/bash -eux <<'CHROOT'
          sed -i 's/^CheckSpace/#CheckSpace/' /etc/pacman.conf
          sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf
          # the initramfs must not be trimmed to the build machine's hardware
          sed -i '/^HOOKS=/s/ autodetect//' /etc/mkinitcpio.conf
          pacman-key --init
          pacman-key --populate archlinuxarm
          pacman -Sy --noconfirm --needed archlinuxarm-keyring
          pacman-key --populate archlinuxarm
          pacman -Su --noconfirm
          pacman -S --noconfirm --needed nano sudo efibootmgr
          mkinitcpio -P
          ln -sf /usr/share/zoneinfo/Asia/Baghdad /etc/localtime
          sed -i 's/^#en_US.UTF-8/en_US.UTF-8/' /etc/locale.gen
          locale-gen
          echo "LANG=en_US.UTF-8" > /etc/locale.conf
          echo "archpi" > /etc/hostname
          rm -rf /var/cache/pacman/pkg/*
          sed -i '/^DisableSandbox/d' /etc/pacman.conf
          sed -i 's/^#CheckSpace/CheckSpace/' /etc/pacman.conf
          CHROOT

          # ---- 6. fstab + UEFI boot script ----
          ROOT_UUID=$(blkid -s UUID -o value "${LOOP}p2")
          BOOT_UUID=$(blkid -s UUID -o value "${LOOP}p1")
          cat > "$ROOT/etc/fstab" <<EOF
          UUID=$ROOT_UUID / ext4 rw,relatime 0 1
          UUID=$BOOT_UUID /boot vfat rw,relatime,fmask=0022,dmask=0022,errors=remount-ro 0 2
          EOF
          sed -i 's/^ *//' "$ROOT/etc/fstab"
          printf 'Image root=UUID=%s rw rootwait console=ttyAMA0 initrd=\\initramfs-linux.img\n' \
            "$ROOT_UUID" > "$ROOT/boot/startup.nsh"

          # ---- 7. sanity checks (the build fails if anything is missing) ----
          ls -la "$ROOT/boot"
          ls "$ROOT/usr/lib/modules"
          [ -f "$ROOT/boot/Image" ]
          [ -f "$ROOT/boot/initramfs-linux.img" ]
          [ -f "$ROOT/boot/startup.nsh" ]
          cat "$ROOT/boot/startup.nsh" "$ROOT/etc/fstab"

          # ---- 8. clean unmount ----
          rm -f "$ROOT/usr/bin/qemu-aarch64-static"
          sync
          fstrim "$ROOT/boot" || true
          fstrim "$ROOT" || true
          umount -R "$ROOT" || true
          umount "$ROOT" || true
          losetup -d "$LOOP"

          qemu-img convert -f raw -O qcow2 -c "$IMG" "$WORK/archlinuxarm-utm.qcow2"
          rm -f "$IMG"
          chown -R "$SUDO_UID:$SUDO_GID" "$WORK"
          ls -lh "$WORK"

      - name: Cleanup (always)
        if: always()
        shell: sudo bash {0}
        run: |
          umount -R /mnt/arch 2>/dev/null || true
          umount /mnt/arch 2>/dev/null || true
          losetup -D || true

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/arch"
          SIZE=$(stat -c %s archlinuxarm-utm.qcow2)
          if [ "$SIZE" -gt 1990000000 ]; then
            split -b 1900M -d archlinuxarm-utm.qcow2 archlinuxarm-utm.qcow2.part
            rm archlinuxarm-utm.qcow2
          fi
          TAG="arch-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Arch Linux ARM for UTM SE ($TAG)" \
            --notes "Login: root / root (change it). Hostname: archpi. Disk: qcow2, UEFI boot via startup.nsh." \
            archlinuxarm-utm.qcow2* 
